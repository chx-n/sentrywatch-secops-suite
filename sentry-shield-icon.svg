<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Dark rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1f2937" stroke-width="4" />

  <!-- Outer Shield Outer Frame -->
  <path d="M 256 70 L 400 130 C 400 270 330 380 256 440 C 182 380 112 270 112 130 Z" 
        fill="#0b1329" 
        stroke="url(#shieldBorder)" 
        stroke-width="10" />

  <!-- Tactical Grid / Radar Rings inside Shield -->
  <circle cx="256" cy="240" r="100" fill="none" stroke="#134e4a" stroke-width="3" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="240" r="65" fill="none" stroke="#14b8a6" stroke-width="4" opacity="0.8" />
  <circle cx="256" cy="240" r="30" fill="#0d9488" opacity="0.3" />

  <!-- Radar Crosshairs -->
  <line x1="256" y1="150" x2="256" y2="330" stroke="#2dd4bf" stroke-width="3" opacity="0.8" />
  <line x1="166" y1="240" x2="346" y2="240" stroke="#2dd4bf" stroke-width="3" opacity="0.8" />

  <!-- Core Sentry Beacon Dot -->
  <circle cx="256" cy="240" r="14" fill="url(#tealGrad)" />
  <circle cx="256" cy="240" r="6" fill="#ffffff" />

  <!-- Angular Tactical Corner Brackets -->
  <path d="M 190 190 L 170 190 L 170 210" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />
  <path d="M 322 190 L 342 190 L 342 210" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />
  <path d="M 190 290 L 170 290 L 170 270" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />
  <path d="M 322 290 L 342 290 L 342 270" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round" />
</svg>
